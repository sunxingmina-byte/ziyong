name: Update VPNGate TXT

on:
  schedule:
    # 每 6 小时运行一次
    - cron: "17 */6 * * *"

  # 支持手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch and process
        run: |
          python fetch.py

      - name: Check generated files
        run: |
          echo "===== vpngate.txt ====="
          wc -l vpngate.txt
          head -n 5 vpngate.txt

          echo ""
          echo "===== geo_cache.json ====="
          wc -l geo_cache.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add vpngate.txt geo_cache.json

          if git diff --cached --quiet; then
            echo "没有数据变化，不创建 commit。"
          else
            git commit -m "Update VPNGate data"
            git push
          fi
