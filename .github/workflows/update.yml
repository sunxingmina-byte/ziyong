name: Update VPNGate

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: update-vpngate
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      
      - name: Run updater
        run: python fetch.py
        
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vpngate.txt geo_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update vpngate data"
            git push
          else
            echo "无变更"
          fi
