name: Update VPNGate TXT

on:
  schedule:
    # 每 6 小时运行一次
    # GitHub 使用 UTC 时间
    - cron: "0 */6 * * *"

  # 支持手动运行
  workflow_dispatch:

# 只允许这个 Workflow 修改仓库内容
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch and process
        run: |
          python fetch.py

      - name: Check generated file
        run: |
          echo "===== vpngate.txt ====="
          wc -l vpngate.txt
          head -n 3 vpngate.txt
          echo "======================="

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add vpngate.txt

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update VPNGate data"
            git push
          fi
